name: Ruff
on: 
  push:
    paths:
      - 'src/**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    paths:
      - 'src/**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:
jobs:
  ruff:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
      - run: ruff format .
      - run: ruff check . --fix
      - run: ruff format .
      - uses: EndBug/add-and-commit@v11
        with: 
          default_author: github_actions
          committer_name: GitHub Actions
          committer_email: actions@github.com
          message: 'Auto-format code'
          push: true

      
      